<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappytechX - Trending Reel Prompts</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .search-box {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    #search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 15px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .categories button {
      border: none;
      background: white;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .categories button:hover {
      background: #2563eb;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 10px 15px 40px;
    }

    .
